[package]
name = "zmk-runtime-macro-desktop"
version = "0.1.5"
description = "Cross-platform desktop client for ZMK runtime macro slots."
authors = ["ZMK Runtime Macro contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zmk_runtime_macro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Transparent custom window corners require Tauri's macOS private API feature;
# this app distributes native installers rather than a Mac App Store package.
# `tray-icon` provides the system tray foundation (tray icon, menu, window
# lifecycle) described in docs/DYNAMIC-AUTOMATION-PLAN.md §4.1.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Authentication uses the protocol's fixed PBKDF2/HMAC parameters. Keep
# password-derived material in non-serializable, zeroized wrappers.
getrandom = "0.2.17"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
zeroize = "1.9"
tauri-plugin-autostart = "2.5.1"

# The local automation API (docs/DYNAMIC-AUTOMATION-PLAN.md §10) always serves a
# fixed loopback address with HTTP/1.1 only and never enables CORS. These are the
# current maintained releases, pinned in Cargo.lock already, so the API adds a
# loopback endpoint instead of a second HTTP stack: `hyper` is the low-level
# HTTP implementation, `hyper-util` supplies the tokio adapter (`TokioIo`,
# `TokioTimer`), `http-body-util` the small JSON response body, and `tokio` only
# the listener/stream types and the stop signal used from Tauri's own runtime
# (`sync` carries `Notify`, which is an in-crate feature and adds no dependency).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync"] }

# Keep the Linux backend explicit so HID Usage metadata remains available for
# safe Runtime Macro HID discovery without assuming a particular HID instance.
# Other supported platforms use hidapi's bundled portable C backend without a
# platform-specific feature.
[target.'cfg(target_os = "linux")'.dependencies.hidapi]
version = "2.6.7"
default-features = false
features = ["linux-static-hidraw"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies.hidapi]
version = "2.6.7"
default-features = false
