[package]
name = "zmk-runtime-macro-desktop"
version = "0.1.2"
description = "Cross-platform desktop client for ZMK runtime macro slots."
authors = ["ZMK Runtime Macro contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zmk_runtime_macro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Transparent custom window corners require Tauri's macOS private API feature;
# this app distributes native installers rather than a Mac App Store package.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Authentication uses the protocol's fixed PBKDF2/HMAC parameters. Keep
# password-derived material in non-serializable, zeroized wrappers.
getrandom = "0.2.17"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
zeroize = "1.9"

# Keep the Linux backend explicit so HID Usage metadata remains available for
# safe Runtime Macro HID discovery without assuming a particular HID instance.
# Other supported platforms use hidapi's bundled portable C backend without a
# platform-specific feature.
[target.'cfg(target_os = "linux")'.dependencies.hidapi]
version = "2.6.7"
default-features = false
features = ["linux-static-hidraw"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies.hidapi]
version = "2.6.7"
default-features = false
